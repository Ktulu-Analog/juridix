name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable   # requis : épinglé par SHA, la branche « stable » n'est plus lue

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies & build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La clé publique minisign du pack MCP n'est plus injectée ici : elle est lue dans
          # `src-tauri/mcp-pack.pub` (compilée dans l'application ; la build échoue si elle est absente).
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Juridix ${{ github.ref_name }}'
          releaseBody: |
            Voir [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) pour les détails.

            ⚠️ **Brouillon** : téléchargez et testez les installeurs (docs/CHECKLIST_RELEASE.md) avant de publier.
          # Toujours un BROUILLON : rien n'est public tant que vous ne cliquez pas sur « Publish release »,
          # après avoir testé les installeurs. Un tag avec suffixe (v1.1.0-rc1) est en plus une pré-version.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          projectPath: src-tauri
          tauriScript: npx tauri
