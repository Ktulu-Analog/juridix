name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Audit hebdomadaire : de nouvelles CVE apparaissent après coup
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── Backend Rust ─────────────────────────────────────────────────────────────
  rust:
    name: Rust (check + clippy + fmt)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable   # requis : épinglé par SHA, la branche « stable » n'est plus lue
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # La clé inclut les features pour éviter de réutiliser des artefacts
          # compilés avec custom-protocol (qui déclenche le check frontendDist)
          key: ${{ runner.os }}-cargo-no-default-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-no-default-

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      # Sans custom-protocol, tauri-codegen passe en mode dev (dev=true) et
      # court-circuite le check de frontendDist dès que devUrl est défini.
      # Aucun stub frontend/build nécessaire.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --no-default-features -- -D warnings

      - name: Check
        working-directory: src-tauri
        run: cargo check --no-default-features

      - name: Tests
        working-directory: src-tauri
        run: cargo test --no-default-features

  # ── Sécurité des dépendances ─────────────────────────────────────────────────
  # Non bloquant pour les PR et les pushs : une CVE publiée entre-temps sur une dépendance
  # sans rapport avec la modification ne doit pas empêcher de fusionner. L'alerte reste visible
  # (job en échec toléré) et, lors de l'exécution hebdomadaire, une issue est ouverte.
  audit:
    name: Audit des dépendances (cargo audit + npm audit)
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: npm audit (dépendances de production)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Ouvrir ou mettre à jour l'issue d'alerte (exécution hebdomadaire seulement)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create audit-dependances --color B60205 --description "Alerte de sécurité sur les dépendances" || true
          existing=$(gh issue list --label audit-dependances --state open --json number --jq '.[0].number // empty')
          body="L'audit hebdomadaire des dépendances (cargo audit / npm audit) a échoué : $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Alerte de sécurité sur les dépendances" --label audit-dependances --body "$body"
          fi
